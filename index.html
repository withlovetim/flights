<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рейсы">
<title>DME — Мои рейсы</title>
<style>
  :root {
    --bg: #eef4f7;
    --card: #ffffff;
    --card2: #e3edf2;
    --text: #17324d;
    --dim: #688096;
    --accent: #087db5;
    --green: #159b79;
    --red: #dc4c55;
    --yellow: #d99b22;
    --magenta: #a65ac4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: linear-gradient(115deg, #06466f 0%, #087db5 65%, #079b91 100%);
    color: #fff;
    padding: 17px 20px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 5px 18px rgba(6, 55, 87, .18);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.28);
    font-size: 20px; font-weight: 900; letter-spacing: -1px;
  }
  header h1 { margin: 0; font-size: 21px; letter-spacing: .5px; }
  header .sub { color: rgba(255,255,255,.78); font-size: 11px; margin-top: 3px; letter-spacing: 1.1px; }
  .container { padding: 16px; max-width: 640px; margin: 0 auto; }
  .toolbar {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1;
    min-width: 80px;
    padding: 12px 16px;
    border: none; border-radius: 12px;
    background: var(--card2); color: var(--text);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:active { opacity: 0.7; }
  .btn.primary { background: linear-gradient(110deg, #087db5, #079b91); color: #fff; box-shadow: 0 4px 10px rgba(8,125,181,.18); }
  .btn.danger { background: var(--red); color: #fff; }
  .search {
    width: 100%; padding: 13px 16px;
    border-radius: 12px; border: 1px solid #dce8ee;
    background: var(--card); color: var(--text);
    font-size: 16px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(25,65,91,.04);
  }
  .search::placeholder { color: var(--dim); }
  .tab-btn { flex: 1; min-width: 90px; }
  .tab-btn.active { background: linear-gradient(110deg, #087db5, #079b91); color: #fff; }
  body { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid #dce8ee; box-shadow: 0 -5px 20px rgba(25,65,91,.08); backdrop-filter: blur(14px); }
  .nav-btn { border: 0; background: transparent; color: var(--dim); border-radius: 12px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: inherit; font-size: 11px; font-weight: 650; cursor: pointer; }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1.1; }
  .nav-btn.active { color: #087db5; background: #eaf4f8; }
  
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}.calendar-month{font-size:19px;font-weight:850;text-transform:capitalize}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-weekday{text-align:center;color:var(--dim);font-size:11px;font-weight:750;padding:7px 0}.calendar-day{min-width:0;min-height:62px;border:1px solid #e0eaf0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);font:inherit;cursor:pointer}.calendar-day.outside{opacity:.32}.calendar-day.today{outline:2px solid #087db5;outline-offset:-2px}.calendar-day.selected{box-shadow:0 0 0 2px #087db5 inset}.calendar-day .day-num{font-size:14px;font-weight:850}.calendar-day .shift-name{font-size:9px;line-height:1.1;text-align:center;font-weight:800}.calendar-day .flight-count{font-size:9px;color:var(--dim)}.shift-day{background:#e8f2ff;border-color:#b9d4f5;color:#175a9a}.shift-night{background:#e4f5f2;border-color:#b5e2d9;color:#087b70}.shift-rest{background:#fff3df;border-color:#f0d6a8;color:#98600c}.shift-off{background:#eef1f5;border-color:#d8dee7;color:#596579}.calendar-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:14px 0 18px}.calendar-legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block}.calendar-info{background:var(--card);border:1px solid #e0eaf0;border-radius:14px;padding:13px;margin-top:12px}@media(max-width:380px){.calendar-grid{gap:3px}.calendar-day{min-height:56px}.calendar-day .shift-name{font-size:8px}}
.password-card { background:var(--card); border:1px solid #e0eaf0; border-radius:15px; padding:14px; margin-bottom:10px; box-shadow:0 3px 12px rgba(25,65,91,.045); }
  .password-card .pw-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .password-card h3 { margin:0 0 5px; font-size:16px; }
  .password-card p { margin:4px 0; color:var(--dim); font-size:13px; overflow-wrap:anywhere; }
  .pw-actions { display:flex; gap:6px; }
  .pw-actions .icon-btn { width:36px; height:36px; }
  .password-value { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .password-value code { flex:1; overflow-wrap:anywhere; background:#f1f6f8; padding:9px; border-radius:8px; font-size:14px; }
  .security-note { background:#fff8e8; border:1px solid #f0dfb5; color:#765719; border-radius:12px; padding:12px; font-size:12px; line-height:1.45; margin-bottom:14px; }
  .vault-panel { background:var(--card); border:1px solid #e0eaf0; border-radius:16px; padding:18px; }
  .vault-panel h3 { margin:0 0 8px; }
  .vault-panel p { color:var(--dim); font-size:13px; line-height:1.45; }
  .vault-panel input, .password-field input, .password-field select, .password-field textarea { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #e0eaf0; background:#f1f6f8; color:var(--text); font:inherit; font-size:16px; }
  .password-field { margin-bottom:12px; }
  .password-field label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
  .password-field textarea { min-height:70px; resize:vertical; }
  .section-heading { font-size: 19px; font-weight: 800; margin: 4px 0 14px; }
  .settings-card { background: var(--card); border: 1px solid #e0eaf0; border-radius: 15px; padding: 16px; margin-bottom: 12px; box-shadow: 0 3px 12px rgba(25,65,91,.045); }
  .settings-card h3 { margin: 0 0 7px; font-size: 16px; }
  .settings-card p { margin: 0 0 13px; color: var(--dim); font-size: 13px; line-height: 1.45; }
  .settings-card .btn { width: 100%; display: block; margin-top: 8px; }
  .phone-group-title { margin: 20px 2px 9px; color: var(--dim); font-size: 12px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; }
  .phone-card { background: var(--card); border: 1px solid #e0eaf0; border-radius: 14px; padding: 13px 15px; margin-bottom: 9px; box-shadow: 0 3px 12px rgba(25,65,91,.045); }
  .phone-name { font-weight: 650; font-size: 15px; margin-bottom: 8px; }
  .phone-numbers { display: flex; flex-wrap: wrap; gap: 8px; }
  .phone-number { display: inline-flex; align-items: center; border-radius: 9px; padding: 8px 11px; background: #eaf3f7; color: #0875a7; font-weight: 750; font-size: 15px; text-decoration: none; }
  .flight {
    background: var(--card);
    border: 1px solid #e0eaf0;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 11px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    box-shadow: 0 3px 12px rgba(25,65,91,.055);
  }
  .flight .info { flex: 1; min-width: 0; }
  .flight.task-registration { border-left: 4px solid #087db5; }
  .flight.task-boarding { border-left: 4px solid #12a995; }
  .task-both { border-left: 4px solid #8b70c7; }

  .task-label {
    display: inline-flex; align-items: center; width: fit-content;
    padding: 4px 8px; border-radius: 7px;
    font-size: 12px; font-weight: 800;
  }
  .task-registration .task-label,
  .schedule-flight.task-registration .schedule-task {
    background: #e5f2fb; color: #0873ad;
  }
  .task-boarding .task-label,
  .schedule-flight.task-boarding .schedule-task {
    background: #def7f2; color: #078b7b;
  }
  .task-both .task-label,
  .schedule-flight.task-both .schedule-task {
    background: #f0eafd; color: #7052ad;
  }
  .airline-line {
    display: flex; align-items: center; gap: 8px;
    color: var(--dim); font-size: 13px; margin-top: 5px;
  }
  .airline-logo {
    width: 30px; height: 30px; border-radius: 8px;
    object-fit: contain; background: #fff; padding: 3px;
    flex-shrink: 0;
  }
  .airline-fallback {
    width: 30px; height: 30px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--card2); color: var(--text);
    font-size: 10px; font-weight: 800; flex-shrink: 0;
  }
  .flight .num {
    font-weight: 700; font-size: 17px;
    display: flex; align-items: center; gap: 8px;
  }
  .flight .dest {
    color: var(--text); opacity: .9;
    font-size: 15px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .flight .when { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .schedule-controls { display:flex; align-items:center; gap:8px; margin: 0 0 14px; }
  .schedule-controls .btn { flex:0 0 auto; min-width:44px; padding:11px 13px; }
  .schedule-date { flex:1; min-width:0; width:100%; padding:11px 10px; border:1px solid #dce8ee; border-radius:11px; background:#fff; color:var(--text); font:inherit; font-size:15px; }
  .schedule-day { color:var(--dim); font-size:12px; font-weight:700; margin:0 0 10px 2px; text-transform:uppercase; letter-spacing:.7px; }
  .schedule-flight { align-items:flex-start; }
  .schedule-task { display:inline-flex; margin-top:9px; padding:5px 9px; border-radius:8px; font-size:12px; font-weight:800; }
  .schedule-time { margin-top:5px; font-size:20px; font-weight:850; letter-spacing:.2px; color:#06466f; }
  .schedule-flight .num { font-size:18px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }
  .actions {
    display: flex; gap: 6px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 10px; border: none;
    background: #eaf2f6; color: var(--text);
    font-size: 16px; cursor: pointer;
  }
  .icon-btn:active { opacity: .7; }
  .empty {
    text-align: center; color: var(--dim);
    padding: 40px 20px; font-size: 15px;
  }
  /* Модалка */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none; align-items: flex-end;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .sheet h2 { margin: 0 0 16px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 13px;
    color: var(--dim); margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; padding: 12px 14px;
    border-radius: 10px; border: none;
    background: #f1f6f8; color: var(--text);
    border: 1px solid #e0eaf0;
    font-size: 16px;
  }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .sheet .buttons {
    display: flex; gap: 10px; margin-top: 20px;
  }
  .sheet .buttons .btn { flex: 1; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">DME</div>
    <div>
      <h1>МОИ РЕЙСЫ</h1>
      <div class="sub">DOMODEDOVO · FLIGHT LOG</div>
      <div class="sub" id="counter">0 рейсов</div>
    </div>
  </div>
</header>

<div class="container">
  <div class="toolbar" id="pageToolbar">
    <button class="btn primary" id="addFlightBtn" onclick="openForm()">+ Добавить рейс</button>
    <button class="btn" onclick="focusLocationSearch()">⌕ Поиск стоек и выходов</button>
    <button class="btn primary" id="addPasswordBtn" style="display:none" onclick="openPasswordForm()">+ Добавить пароль</button>
    <button class="btn primary" id="addPhoneBtn" style="display:none" onclick="openPhoneForm()">+ Добавить номер</button>
  </div>
  <input type="text" class="search" id="search" placeholder="🔍 Поиск по номеру, направлению, стойке, выходу или стоянке" oninput="render()">
  <div id="list"></div>
</div>

<nav class="bottom-nav" aria-label="Основная навигация">
  <button class="nav-btn active" data-tab="flights" onclick="switchTab('flights')"><span class="nav-icon">✈️</span><span>Рейсы</span></button>
  <button class="nav-btn" data-tab="schedule" onclick="switchTab('schedule')"><span class="nav-icon">🗓️</span><span>Расписание</span></button>
  <button class="nav-btn" data-tab="phones" onclick="switchTab('phones')"><span class="nav-icon">☎️</span><span>Телефоны</span></button>
  <button class="nav-btn" data-tab="passwords" onclick="switchTab('passwords')"><span class="nav-icon">🔐</span><span>Пароли</span></button>
  <button class="nav-btn" data-tab="calendar" onclick="switchTab('calendar')"><span class="nav-icon">📅</span><span>Календарь</span></button>
  <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')"><span class="nav-icon">⚙️</span><span>Настройки</span></button>
</nav>

<!-- Форма телефона -->
<div class="overlay" id="phoneOverlay" onclick="if(event.target===this) closePhoneForm()">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2 id="phoneFormTitle">Новый контакт</h2>
    <div class="field"><label>Служба / организация</label><input id="ph-group" maxlength="100" placeholder="Например, Службы аэропорта"></div>
    <div class="field"><label>Название контакта</label><input id="ph-name" maxlength="120" placeholder="Например, Диспетчер регистрации"></div>
    <div class="field"><label>Номер телефона (несколько — каждый с новой строки)</label><textarea id="ph-numbers" maxlength="500" rows="3" placeholder="+7 (495) 000-00-00&#10;12906"></textarea></div>
    <div class="buttons"><button class="btn" onclick="closePhoneForm()">Отмена</button><button class="btn primary" onclick="savePhoneRecord()">Сохранить</button></div>
  </div>
</div>

<!-- Форма пароля -->
<div class="overlay" id="passwordOverlay" onclick="if(event.target===this) closePasswordForm()">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2 id="passwordFormTitle">Новая запись</h2>
    <div class="password-field"><label>Для чего запись</label><select id="p-scope" onchange="updatePasswordOrgLabel()"><option value="airline">Авиакомпания</option><option value="airport">Система аэропорта</option></select></div>
    <div class="password-field"><label id="p-org-label">Авиакомпания</label><input id="p-organization" maxlength="80" placeholder="Например, S7 Airlines"></div>
    <div class="password-field"><label>Название системы</label><input id="p-system" maxlength="100" placeholder="Например, DCS"></div>
    <div class="password-field"><label>Логин</label><input id="p-login" maxlength="150" autocomplete="off"></div>
    <div class="password-field"><label>Пароль</label><input id="p-password" type="password" maxlength="500" autocomplete="new-password"></div>
    <div class="password-field"><label>Примечание (необязательно)</label><textarea id="p-note" maxlength="500"></textarea></div>
    <div class="buttons"><button class="btn" onclick="closePasswordForm()">Отмена</button><button class="btn primary" onclick="savePasswordRecord()">Сохранить</button></div>
  </div>
</div>

<!-- Форма добавления/редактирования -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeForm()">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2 id="formTitle">Новый рейс</h2>
    <div class="field">
      <label>Авиакомпания</label>
      <select id="f-airline" onchange="loadAirlineRoutes()">
        <option value="">Выбери авиакомпанию</option>
        <option>Air Arabia (G9)</option>
        <option>Air Arabia Abu Dhabi (3L)</option>
        <option>Avia Traffic Company (YK)</option>
        <option>AZAL / Azerbaijan Airlines (J2)</option>
        <option>Azimuth (A4)</option>
        <option>Belavia (B2)</option>
        <option>Centrum Air (C6)</option>
        <option>EgyptAir (MS)</option>
        <option>EL AL (LY)</option>
        <option>Emirates (EK)</option>
        <option>Ethiopian Airlines (ET)</option>
        <option>FlyOne Armenia (3F)</option>
        <option>Jazeera Airways (J9)</option>
        <option>NordStar (Y7)</option>
        <option>Qanot Sharq (HH)</option>
        <option>Royal Jordanian (RJ)</option>
        <option>S7 Airlines (S7)</option>
        <option>Северсталь (D2)</option>
        <option>Sky FRU (R8)</option>
        <option>Somon Air (SZ)</option>
        <option>Turkmenistan Airlines (T5)</option>
        <option>Уральские авиалинии (U6)</option>
        <option>Uzbekistan Airways (HY)</option>
        <option>Ямал (YC)</option>
        <option>Другая авиакомпания</option>
      </select>
    </div>
    <div class="field" id="route-picker-field" style="display:none">
      <label>Рейс из справочника DME</label>
      <select id="f-route" onchange="selectKnownRoute()">
        <option value="">Выбери рейс или введи вручную</option>
      </select>
      <small style="display:block;color:var(--muted);margin-top:6px">Если рейса нет в списке, заполни номер и направление вручную. Новый рейс сохранится в справочнике.</small>
    </div>
    <div class="field">
      <label>Номер рейса</label>
      <input type="text" id="f-number" placeholder="SU-1234" autocapitalize="characters">
    </div>
    <div class="field">
      <label>Пункт назначения</label>
      <input type="text" id="f-destination" placeholder="Москва">
    </div>
    <div class="row">
      <div class="field">
        <label>Дата</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Время рейса</label>
        <input type="time" id="f-time" onchange="suggestTaskTimes()">
      </div>
    </div>
    <div class="field">
      <label>Тип задачи</label>
      <select id="f-task-type">
        <option value="Регистрация">Регистрация</option>
        <option value="Посадка">Посадка</option>
        <option value="Регистрация и посадка">Регистрация и посадка</option>
      </select>
    </div>
    <div class="row">
      <div class="field">
        <label>Начало задачи</label>
        <input type="time" id="f-task-start">
      </div>
      <div class="field">
        <label>Окончание задачи</label>
        <input type="time" id="f-task-end">
      </div>
    </div>
    <div class="field"><label>Стойки регистрации</label><input type="text" id="f-checkin-counters" placeholder="Например: 101–108"></div>
    <div class="field"><label>Выходы на посадку</label><input type="text" id="f-gates" placeholder="Например: 12, 13"></div>
    <div class="field"><label>Место стоянки ВС</label><input type="text" id="f-aircraft-stand" placeholder="Например: 52"></div>
    <div class="buttons">
      <button class="btn" onclick="closeForm()">Отмена</button>
      <button class="btn primary" onclick="saveFlight()">Сохранить</button>
    </div>
  </div>
</div>

<div class="overlay" id="passportOverlay" onclick="if(event.target===this) closeFlightPassport()">
 <div class="sheet" onclick="event.stopPropagation()">
  <h2>Паспорт рейса</h2><div id="passportContent"></div>
  <div class="field"><label>Заметки</label><textarea id="passportNotes" rows="3" placeholder="Важная информация по рейсу"></textarea></div>
  <div class="buttons"><button class="btn" onclick="closeFlightPassport()">Закрыть</button><button class="btn primary" onclick="savePassportNotes()">Сохранить заметку</button></div>
 </div>
</div>
<script>
const STORAGE_KEY = 'flights_v1';
let flights = [];
let editingId = null;
let activeTab = 'flights';
let scheduleDate = null;
let calendarMonth = new Date(2026,10,1);
let calendarSelected = '2026-11-14';
const SHIFT_ANCHOR_DATE = '2026-11-14';
const VAULT_KEY = 'dme_password_vault_v1';
let vaultRecords = [];

function loadPhoneGroups() {

  } catch (e) {}
  phoneGroups = PHONE_GROUPS.map((group, gi) => ({ title: group.title, items: group.items.map((item, i) => ({ id: "default-" + gi + "-" + i, name: item.name, numbers: item.numbers.slice() })) }));

function openPhoneForm(id) {

  document.getElementById('phoneFormTitle').textContent = id ? 'Изменить контакт' : 'Новый контакт';
  document.getElementById('ph-group').value = groupTitle;
  document.getElementById('ph-name').value = item ? item.name : '';

  document.getElementById('phoneOverlay').classList.add('open');
}

function deletePhoneRecord(id) {
  if (!confirm('Удалить этот контакт и все его номера?')) return;
  for (const group of phoneGroups) group.items = group.items.filter(item => item.id !== id);
  phoneGroups = phoneGroups.filter(group => group.items.length);
  persistPhoneGroups();
  renderPhones();
}
function savePhoneRecord() {
  const groupTitle = document.getElementById('ph-group').value.trim();
  const name = document.getElementById('ph-name').value.trim();
  const numbers = document.getElementById('ph-numbers').value.split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
  if (!groupTitle || !name || !numbers.length) { alert('Заполни службу, название контакта и хотя бы один номер.'); return; }
  if (editingPhoneId) for (const group of phoneGroups) group.items = group.items.filter(x => x.id !== editingPhoneId);
  let target = phoneGroups.find(g => g.title.toLowerCase() === groupTitle.toLowerCase());
  if (!target) { target = { title: groupTitle, items: [] }; phoneGroups.push(target); }
  target.items.push({ id: editingPhoneId || ('phone-' + Date.now()), name: name, numbers: numbers });
  phoneGroups = phoneGroups.filter(g => g.items.length); persistPhoneGroups(); closePhoneForm(); renderPhones();
}

}

  return new Date(now.getTime() - offset * 60000).toISOString().slice(0,10);
}

function bytesToBase64(bytes) { return btoa(String.fromCharCode(...new Uint8Array(bytes))); }
function base64ToBytes(value) { return Uint8Array.from(atob(value), c => c.charCodeAt(0)); }
async function deriveVaultKey(passphrase, salt) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}

function loadVault() {
  try {
    const raw = localStorage.getItem(VAULT_KEY);
    if (!raw) { vaultRecords = []; return; }
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) { vaultRecords = parsed; return; }
    if (parsed && Array.isArray(parsed.records)) { vaultRecords = parsed.records; return; }
    // Старый зашифрованный формат нельзя прочитать без прежнего мастер-пароля.
    vaultRecords = [];
  } catch (e) { vaultRecords = []; }
}
function persistVault() {
  localStorage.setItem(VAULT_KEY, JSON.stringify(vaultRecords));
}

  vaultRecords = vaultRecords.filter(x => x.id !== id); revealedPasswords.delete(id);
  await persistVault(); render();

function render() {
  const list = document.getElementById('list');
  if (activeTab === 'calendar') { renderCalendar(); return; }
  if (activeTab === 'phones') { renderPhones(); return; }
  if (activeTab === 'passwords') { renderPasswords(); return; }
  if (activeTab === 'settings') { renderSettings(); return; }
  list.innerHTML = '';

  document.getElementById('counter').textContent = flights.length === 0 ? 'Пока нет рейсов' :
    `${flights.length} ${plural(flights.length, 'рейс', 'рейса', 'рейсов')}`;
  const query = document.getElementById('search').value.trim().toLowerCase();
  let items = flights.slice();
  if (activeTab === 'schedule') {
    if (!scheduleDate) scheduleDate = localDateISO();
    items = items.filter(f => f.date === scheduleDate)
      .sort((a,b) => String(a.taskStart || a.time || '').localeCompare(String(b.taskStart || b.time || '')));
  } else {
    items.reverse();
  }
  if (query) items = items.filter(f =>
    String(f.number || '').toLowerCase().includes(query) ||
    String(f.destination || '').toLowerCase().includes(query) ||
    String(f.airline || '').toLowerCase().includes(query) ||
    String(f.checkinCounters || '').toLowerCase().includes(query) ||
    String(f.gates || '').toLowerCase().includes(query) ||
    String(f.aircraftStand || '').toLowerCase().includes(query)
  );

  if (activeTab === 'schedule') {
    list.innerHTML = `
      <div class="section-heading">Моё расписание</div>
      <div class="schedule-controls">
        <button class="btn" onclick="shiftScheduleDate(-1)" aria-label="Предыдущий день">‹</button>
        <input class="schedule-date" type="date" value="${scheduleDate}" onchange="scheduleDate=this.value;render()">
        <button class="btn" onclick="shiftScheduleDate(1)" aria-label="Следующий день">›</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="schedule-day">${scheduleDate === localDateISO() ? 'Сегодня' : formatDate(scheduleDate)}</div>
        <button class="btn" style="flex:0 0 auto;padding:8px 12px;font-size:12px" onclick="scheduleDate=localDateISO();render()">Сегодня</button>
      </div>`;
  }
  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = query ? '🔍 Ничего не найдено' : (activeTab === 'schedule' ? 'На выбранную дату задач пока нет' : '🛫 Нет рейсов. Нажми «+ Добавить рейс»');
    list.appendChild(empty);
    return;
  }
  list.insertAdjacentHTML('beforeend', items.map(activeTab === 'schedule' ? renderScheduleCard : renderFlightCard).join(''));
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportBackup() {
  const backup = { version: 1, exportedAt: new Date().toISOString(), flights };
  downloadFile(JSON.stringify(backup, null, 2), 'dme-backup-' + localDateISO() + '.json', 'application/json;charset=utf-8');
}

function importBackup(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const imported = Array.isArray(parsed) ? parsed : parsed.flights;
      if (!Array.isArray(imported) || !imported.every(f => f && f.id && f.number && f.date)) throw new Error('invalid');
      if (!confirm('Заменить текущий список рейсов данными из резервной копии? Сначала при необходимости скачай текущую копию.')) return;
      flights = imported;
      save();
      switchTab('flights');
      alert('Резервная копия восстановлена.');
    } catch (e) { alert('Не удалось прочитать файл. Выбери резервную копию DME в формате JSON.'); }
    finally { event.target.value = ''; }
  };
  reader.readAsText(file);
}

function exportCSV() {
  const rows = [['Авиакомпания','Номер рейса','Направление','Дата','Время рейса','Тип задачи','Начало задачи','Окончание задачи','Стойки регистрации','Выходы на посадку','Место стоянки ВС'], ...flights.map(f => [f.airline || '',f.number || '',f.destination || '',f.date || '',f.time || '',f.taskType || 'Регистрация',f.taskStart || '',f.taskEnd || '',f.checkinCounters || '',f.gates || '',f.aircraftStand || ''])];
  const csv = '\uFEFF' + rows.map(row => row.map(value => '"' + String(value).replace(/"/g,'""') + '"').join(';')).join('\r\n');
  downloadFile(csv, 'dme-flights-' + localDateISO() + '.csv', 'text/csv;charset=utf-8');
}

function getAirlineCode(name) {
  const match = String(name).match(/\(([A-Z0-9]{2})\)/);
  return match ? match[1] : '✈';
}

    : '';
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

let customDmeRoutes = [];

function loadCustomDmeRoutes() {
  try {
    const saved = JSON.parse(localStorage.getItem(ROUTE_CATALOG_KEY) || '[]');
    customDmeRoutes = Array.isArray(saved) ? saved : [];
  } catch (e) {
    customDmeRoutes = [];
  }
}

function loadAirlineRoutes() {
  const airline = document.getElementById('f-airline').value;
  const field = document.getElementById('route-picker-field');
  const select = document.getElementById('f-route');
  const excluded = airline.includes('(S7)') || airline.includes('(U6)');
  if (!airline || excluded) {
    field.style.display = 'none';
    select.innerHTML = '<option value="">Выбери рейс или введи вручную</option>';
    return;
  }
  field.style.display = 'block';
  const seeded = DME_ROUTE_SEED[airline] || [];
  const custom = customDmeRoutes.filter(x =>
    x.airline === airline &&
    !(airline === 'Emirates (EK)' && ['EK 129','EK 131','EK 133'].includes(x.number.toUpperCase().replace(/\\s+/g,' ').trim()))
  ).map(x => [x.number, x.destination]);
  const merged = seeded.concat(custom).filter((route, index, arr) =>
    arr.findIndex(x => x[0].toUpperCase() === route[0].toUpperCase()) === index
  );
  select.innerHTML = '<option value="">Выбери рейс или введи вручную</option>';
  merged.forEach(route => {
    const option = document.createElement('option');
    option.value = route[0] + '|' + route[1] + '|' + (route[2] || '');
    option.textContent = route[0] + ' — ' + route[1] + (route[2] ? ' · ' + route[2] : '');
    select.appendChild(option);
  });
}

function selectKnownRoute() {
  const value = document.getElementById('f-route').value;
  if (!value) return;
  const parts = value.split('|');
  document.getElementById('f-number').value = parts[0] || '';
  document.getElementById('f-destination').value = parts[1] || '';
  if (parts[2]) {
    document.getElementById('f-time').value = parts[2];
    suggestTaskTimes();
  }
}

function suggestTaskTimes() {
  const flightTime = document.getElementById('f-time').value;
  if (!flightTime) return;
  const parts = flightTime.split(':').map(Number);
  const total = parts[0] * 60 + parts[1];
  const format = value => {
    const minutes = (value + 1440) % 1440;
    return String(Math.floor(minutes / 60)).padStart(2,'0') + ':' + String(minutes % 60).padStart(2,'0');
  };
  document.getElementById('f-task-start').value = format(total - 240);
  document.getElementById('f-task-end').value = format(total - 60);
  document.getElementById('f-checkin-counters').value = f ? (f.checkinCounters || '') : '';
  document.getElementById('f-gates').value = f ? (f.gates || '') : '';
  document.getElementById('f-aircraft-stand').value = f ? (f.aircraftStand || '') : '';
}

function saveCustomDmeRoute(airline, number, destination) {
  if (!airline || airline.includes('(S7)') || airline.includes('(U6)')) return;
  const exists = customDmeRoutes.some(x =>
    x.airline === airline && x.number.toUpperCase() === number.toUpperCase()
  );
  if (!exists) {
    customDmeRoutes.push({ airline, number, destination });
    localStorage.setItem(ROUTE_CATALOG_KEY, JSON.stringify(customDmeRoutes));
  }
}

function openForm(id = null) {
  editingId = id;
  const f = id ? flights.find(x => x.id === id) : null;

  document.getElementById('formTitle').textContent = f ? 'Редактировать рейс' : 'Новый рейс';
  document.getElementById('f-airline').value = f ? (f.airline || '') : '';
  loadAirlineRoutes();
  document.getElementById('f-route').value = '';
  document.getElementById('f-number').value = f ? f.number : '';
  document.getElementById('f-destination').value = f ? f.destination : '';
  document.getElementById('f-date').value = f ? f.date : new Date().toISOString().slice(0,10);
  document.getElementById('f-time').value = f ? (f.time || '') : '12:00';
  document.getElementById('f-task-type').value = f ? (f.taskType || 'Регистрация') : 'Регистрация';
  document.getElementById('f-task-start').value = f ? (f.taskStart || '') : '';
  document.getElementById('f-task-end').value = f ? (f.taskEnd || '') : '';
  document.getElementById('f-checkin-counters').value = f ? (f.checkinCounters || '') : '';
  document.getElementById('f-gates').value = f ? (f.gates || '') : '';
  document.getElementById('f-aircraft-stand').value = f ? (f.aircraftStand || '') : '';
  if (!f) suggestTaskTimes();

  document.getElementById('overlay').classList.add('open');
}

function closeForm() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

function saveFlight() {
  const airline = document.getElementById('f-airline').value;
  const number = document.getElementById('f-number').value.trim().toUpperCase();
  const destination = document.getElementById('f-destination').value.trim();
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const taskType = document.getElementById('f-task-type').value;
  const taskStart = document.getElementById('f-task-start').value;
  const taskEnd = document.getElementById('f-task-end').value;
  const checkinCounters = document.getElementById('f-checkin-counters').value.trim();
  const gates = document.getElementById('f-gates').value.trim();
  const aircraftStand = document.getElementById('f-aircraft-stand').value.trim();

  if (!airline || !number || !destination || !date || !time || !taskStart || !taskEnd) {
    alert('Заполни авиакомпанию, рейс, дату, время рейса и время начала и окончания задачи');
    return;
  }

  if (taskEnd < taskStart) {
    alert('Время окончания задачи не может быть раньше времени начала.');
    return;
  }

  saveCustomDmeRoute(airline, number, destination);

  if (editingId) {
    const f = flights.find(x => x.id === editingId);
    Object.assign(f, { airline, number, destination, date, time, taskType, taskStart, taskEnd, checkinCounters, gates, aircraftStand });
  } else {
    flights.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      airline, number, destination, date, time, taskType, taskStart, taskEnd, checkinCounters, gates, aircraftStand
    });
  }

  save();
  closeForm();
  render();
}

function removeFlight(id) {
  const f = flights.find(x => x.id === id);
  if (!f) return;
  if (!confirm(`Удалить рейс ${f.number}?`)) return;
  flights = flights.filter(x => x.id !== id);
  save();
  render();
}
