<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рейсы">
<title>DME — Мои рейсы</title>
<style>
  :root {
    --bg: #eef4f7;
    --card: #ffffff;
    --card2: #e3edf2;
    --text: #17324d;
    --dim: #688096;
    --accent: #087db5;
    --green: #159b79;
    --red: #dc4c55;
    --yellow: #d99b22;
    --magenta: #a65ac4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: linear-gradient(115deg, #06466f 0%, #087db5 65%, #079b91 100%);
    color: #fff;
    padding: 17px 20px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 5px 18px rgba(6, 55, 87, .18);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.28);
    font-size: 20px; font-weight: 900; letter-spacing: -1px;
  }
  header h1 { margin: 0; font-size: 21px; letter-spacing: .5px; }
  header .sub { color: rgba(255,255,255,.78); font-size: 11px; margin-top: 3px; letter-spacing: 1.1px; }
  .container { padding: 16px; max-width: 640px; margin: 0 auto; }
  .toolbar {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1;
    min-width: 80px;
    padding: 12px 16px;
    border: none; border-radius: 12px;
    background: var(--card2); color: var(--text);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:active { opacity: 0.7; }
  .btn.primary { background: linear-gradient(110deg, #087db5, #079b91); color: #fff; box-shadow: 0 4px 10px rgba(8,125,181,.18); }
  .btn.danger { background: var(--red); color: #fff; }
  .search {
    width: 100%; padding: 13px 16px;
    border-radius: 12px; border: 1px solid #dce8ee;
    background: var(--card); color: var(--text);
    font-size: 16px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(25,65,91,.04);
  }
  .search::placeholder { color: var(--dim); }
  .tab-btn { flex: 1; min-width: 90px; }
  .tab-btn.active { background: linear-gradient(110deg, #087db5, #079b91); color: #fff; }
  .phone-group-title { margin: 20px 2px 9px; color: var(--dim); font-size: 12px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; }
  .phone-card { background: var(--card); border: 1px solid #e0eaf0; border-radius: 14px; padding: 13px 15px; margin-bottom: 9px; box-shadow: 0 3px 12px rgba(25,65,91,.045); }
  .phone-name { font-weight: 650; font-size: 15px; margin-bottom: 8px; }
  .phone-numbers { display: flex; flex-wrap: wrap; gap: 8px; }
  .phone-number { display: inline-flex; align-items: center; border-radius: 9px; padding: 8px 11px; background: #eaf3f7; color: #0875a7; font-weight: 750; font-size: 15px; text-decoration: none; }
  .flight {
    background: var(--card);
    border: 1px solid #e0eaf0;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 11px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    box-shadow: 0 3px 12px rgba(25,65,91,.055);
  }
  .flight .info { flex: 1; min-width: 0; }
  .airline-line {
    display: flex; align-items: center; gap: 8px;
    color: var(--dim); font-size: 13px; margin-top: 5px;
  }
  .airline-logo {
    width: 30px; height: 30px; border-radius: 8px;
    object-fit: contain; background: #fff; padding: 3px;
    flex-shrink: 0;
  }
  .airline-fallback {
    width: 30px; height: 30px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--card2); color: var(--text);
    font-size: 10px; font-weight: 800; flex-shrink: 0;
  }
  .flight .num {
    font-weight: 700; font-size: 17px;
    display: flex; align-items: center; gap: 8px;
  }
  .flight .dest {
    color: var(--text); opacity: .9;
    font-size: 15px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .flight .when {
    color: var(--dim); font-size: 13px; margin-top: 4px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }
  .actions {
    display: flex; gap: 6px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 10px; border: none;
    background: #eaf2f6; color: var(--text);
    font-size: 16px; cursor: pointer;
  }
  .icon-btn:active { opacity: .7; }
  .empty {
    text-align: center; color: var(--dim);
    padding: 40px 20px; font-size: 15px;
  }
  /* Модалка */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none; align-items: flex-end;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .sheet h2 { margin: 0 0 16px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 13px;
    color: var(--dim); margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; padding: 12px 14px;
    border-radius: 10px; border: none;
    background: #f1f6f8; color: var(--text);
    border: 1px solid #e0eaf0;
    font-size: 16px;
  }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .sheet .buttons {
    display: flex; gap: 10px; margin-top: 20px;
  }
  .sheet .buttons .btn { flex: 1; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">DME</div>
    <div>
      <h1>МОИ РЕЙСЫ</h1>
      <div class="sub">DOMODEDOVO · FLIGHT LOG</div>
      <div class="sub" id="counter">0 рейсов</div>
    </div>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <button class="btn tab-btn active" id="tabFlights" onclick="switchTab('flights')">Рейсы</button>
    <button class="btn tab-btn" id="tabPhones" onclick="switchTab('phones')">Телефоны</button>
    <button class="btn primary" id="addFlightBtn" onclick="openForm()">+ Добавить рейс</button>
  </div>
  <input type="text" class="search" id="search" placeholder="🔍 Поиск по номеру или направлению" oninput="render()">
  <div id="list"></div>
</div>

<!-- Форма добавления/редактирования -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeForm()">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2 id="formTitle">Новый рейс</h2>
    <div class="field">
      <label>Авиакомпания</label>
      <select id="f-airline">
        <option value="">Выбери авиакомпанию</option>
        <option>Air Arabia (G9)</option>
        <option>Air Arabia Abu Dhabi (3L)</option>
        <option>Avia Traffic Company (YK)</option>
        <option>AZAL / Azerbaijan Airlines (J2)</option>
        <option>Azimuth (A4)</option>
        <option>Belavia (B2)</option>
        <option>Centrum Air (C6)</option>
        <option>EgyptAir (MS)</option>
        <option>EL AL (LY)</option>
        <option>Emirates (EK)</option>
        <option>Ethiopian Airlines (ET)</option>
        <option>FlyOne Armenia (3F)</option>
        <option>Jazeera Airways (J9)</option>
        <option>NordStar (Y7)</option>
        <option>Qanot Sharq (HH)</option>
        <option>Royal Jordanian (RJ)</option>
        <option>S7 Airlines (S7)</option>
        <option>Северсталь (D2)</option>
        <option>Sky FRU (R8)</option>
        <option>Somon Air (SZ)</option>
        <option>Turkmenistan Airlines (T5)</option>
        <option>Уральские авиалинии (U6)</option>
        <option>Uzbekistan Airways (HY)</option>
        <option>Ямал (YC)</option>
        <option>Другая авиакомпания</option>
      </select>
    </div>
    <div class="field">
      <label>Номер рейса</label>
      <input type="text" id="f-number" placeholder="SU-1234" autocapitalize="characters">
    </div>
    <div class="field">
      <label>Пункт назначения</label>
      <input type="text" id="f-destination" placeholder="Москва">
    </div>
    <div class="row">
      <div class="field">
        <label>Дата</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Время</label>
        <input type="time" id="f-time">
      </div>
    </div>
    <div class="field">
      <label>Статус</label>
      <select id="f-status">
        <option>Запланирован</option>
        <option>В пути</option>
        <option>Задержан</option>
        <option>Отменён</option>
        <option>Прибыл</option>
      </select>
    </div>
    <div class="buttons">
      <button class="btn" onclick="closeForm()">Отмена</button>
      <button class="btn primary" onclick="saveFlight()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'flights_v1';
let flights = [];
let editingId = null;
let activeTab = 'flights';

const PHONE_GROUPS = [
  { title: 'Службы аэропорта', items: [
    { name: 'Коммутатор', numbers: ['+7 (495) 967-83-63'] },
    { name: 'DCS', numbers: ['12983', '12972'] },
    { name: 'Диспетчер регистрации', numbers: ['12906'] },
    { name: 'Диспетчер посадки — ВВЛ', numbers: ['10538'] },
    { name: 'Диспетчер посадки — МВЛ', numbers: ['10538'] },
    { name: 'Центровка', numbers: ['12928'] },
    { name: 'Сопровождение маломобильных', numbers: ['12957'] },
    { name: 'Сопровождение UMNR CREW', numbers: ['51811'] },
    { name: 'Загрузка Россия', numbers: ['50212', '50497'] },
    { name: 'Загрузка междугородка', numbers: ['50483'] },
    { name: 'Планирование стоек (вкл./выкл.)', numbers: ['12925'] },
    { name: 'Диспетчер автобусов', numbers: ['12995'] },
    { name: 'Расстановка', numbers: ['13949'] },
    { name: 'Трансфер', numbers: ['35099'] },
    { name: 'Бизнес ВВЛ', numbers: ['20817'] },
    { name: 'Бизнес ТИ', numbers: ['20808'] },
    { name: 'Негабарит МВЛ', numbers: ['12608'] },
    { name: 'Негабарит ВВЛ', numbers: ['12496'] },
    { name: 'Бесхоз', numbers: ['26175'] },
    { name: 'Медики', numbers: ['51533'] },
    { name: 'Бизнес-зал', numbers: ['50945'] },
    { name: 'Бизнес-зал «Горизонт»', numbers: ['50958'] }
  ]},
  { title: 'Представительства авиакомпаний', items: [
    { name: 'Ямал', numbers: ['26658'] },
    { name: 'Нордстар', numbers: ['89262093625'] }
  ]}
];

const STATUS_COLORS = {
  'Запланирован': 'var(--accent)',
  'В пути': 'var(--yellow)',
  'Задержан': 'var(--magenta)',
  'Отменён': 'var(--red)',
  'Прибыл': 'var(--green)',
};

function switchTab(tab) {
  activeTab = tab;
  const flightsTab = document.getElementById('tabFlights');
  const phonesTab = document.getElementById('tabPhones');
  flightsTab.classList.toggle('active', tab === 'flights');
  phonesTab.classList.toggle('active', tab === 'phones');
  document.getElementById('addFlightBtn').style.display = tab === 'flights' ? '' : 'none';
  const search = document.getElementById('search');
  search.value = '';
  search.placeholder = tab === 'phones' ? '🔍 Поиск по службе или номеру телефона' : '🔍 Поиск по номеру или направлению';
  render();
}

function renderPhones() {
  const list = document.getElementById('list');
  const query = document.getElementById('search').value.trim().toLowerCase();
  const groups = PHONE_GROUPS.map(group => ({
    title: group.title,
    items: group.items.filter(item =>
      (item.name + ' ' + item.numbers.join(' ')).toLowerCase().includes(query)
    )
  })).filter(group => group.items.length);
  if (!groups.length) {
    list.innerHTML = '<div class="empty">🔍 Ничего не найдено</div>';
    return;
  }
  list.innerHTML = groups.map(group => `
    <div class="phone-group-title">${escapeHtml(group.title)}</div>
    ${group.items.map(item => `
      <div class="phone-card">
        <div class="phone-name">${escapeHtml(item.name)}</div>
        <div class="phone-numbers">${item.numbers.map(number => {
          const tel = number.replace(/[^+\\d]/g, '');
          return `<a class="phone-number" href="tel:${tel}">${escapeHtml(number)}</a>`;
        }).join('')}</div>
      </div>
    `).join('')}
  `).join('');
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    flights = raw ? JSON.parse(raw) : [];
  } catch (e) {
    flights = [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(flights));
}

function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function render() {
  if (activeTab === 'phones') { renderPhones(); return; }
  const list = document.getElementById('list');
  const query = document.getElementById('search').value.trim().toLowerCase();

  let items = flights.slice().reverse(); // новые сверху
  if (query) {
    items = items.filter(f =>
      f.number.toLowerCase().includes(query) ||
      f.destination.toLowerCase().includes(query)
    );
  }

  document.getElementById('counter').textContent =
    flights.length === 0 ? 'Пока нет рейсов' :
    `${flights.length} ${plural(flights.length, 'рейс', 'рейса', 'рейсов')}`;

  if (items.length === 0) {
    list.innerHTML = `<div class="empty">${
      query ? '🔍 Ничего не найдено' : '🛫 Нет рейсов. Нажми «+ Добавить»'
    }</div>`;
    return;
  }

  list.innerHTML = items.map(f => {
    const color = STATUS_COLORS[f.status] || 'var(--dim)';
    return `
      <div class="flight">
        <div class="info">
          <div class="num">
            <span class="dot" style="background:${color}"></span>
            ${escapeHtml(f.number)}
          </div>
          ${f.airline ? (() => { const logo = getAirlineLogo(f.airline); return `<div class="airline-line"><img class="airline-logo" src="${logo}" alt="" onerror="this.outerHTML='<span class=\\'airline-fallback\\'>${escapeHtml(getAirlineCode(f.airline))}</span>'"><span>${escapeHtml(f.airline)}</span></div>`; })() : ''}
          <div class="dest">${escapeHtml(f.destination)}</div>
          <div class="when">${formatDate(f.date)} ${f.time} · ${f.status}</div>
        </div>
        <div class="actions">
          <button class="icon-btn" onclick="openForm('${f.id}')">✏️</button>
          <button class="icon-btn" onclick="removeFlight('${f.id}')">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
}

const AIRLINE_DOMAINS = {
  'Air Arabia (G9)': 'airarabia.com',
  'Air Arabia Abu Dhabi (3L)': 'airarabia.com',
  'Avia Traffic Company (YK)': 'asiatraffic.com',
  'AZAL / Azerbaijan Airlines (J2)': ' azal.az'.trim(),
  'Azimuth (A4)': 'azimuth.ru',
  'Belavia (B2)': 'belavia.by',
  'Centrum Air (C6)': 'centrum-air.com',
  'EgyptAir (MS)': 'egyptair.com',
  'EL AL (LY)': 'elal.com',
  'Emirates (EK)': 'emirates.com',
  'Ethiopian Airlines (ET)': 'ethiopianairlines.com',
  'FlyOne Armenia (3F)': 'flyone.eu',
  'Jazeera Airways (J9)': 'jazeeraairways.com',
  'NordStar (Y7)': 'nordstar.ru',
  'Qanot Sharq (HH)': 'qanotsharq.com',
  'Royal Jordanian (RJ)': 'rj.com',
  'S7 Airlines (S7)': 's7.ru',
  'Северсталь (D2)': 'severstal-avia.ru',
  'Sky FRU (R8)': 'skyfru.com',
  'Somon Air (SZ)': 'somonair.com',
  'Turkmenistan Airlines (T5)': 'turkmenistanairlines.tm',
  'Уральские авиалинии (U6)': 'uralairlines.ru',
  'Uzbekistan Airways (HY)': ' uzairways.com'.trim(),
  'Ямал (YC)': 'yamal-airlines.ru'
};

function getAirlineCode(name) {
  const match = String(name).match(/\\(([A-Z0-9]{2})\\)/);
  return match ? match[1] : '✈';
}

function getAirlineLogo(name) {
  const domain = AIRLINE_DOMAINS[name];
  return domain
    ? 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=128'
    : '';
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function openForm(id = null) {
  editingId = id;
  const f = id ? flights.find(x => x.id === id) : null;

  document.getElementById('formTitle').textContent = f ? 'Редактировать рейс' : 'Новый рейс';
  document.getElementById('f-airline').value = f ? (f.airline || '') : '';
  document.getElementById('f-number').value = f ? f.number : '';
  document.getElementById('f-destination').value = f ? f.destination : '';
  document.getElementById('f-date').value = f ? f.date : new Date().toISOString().slice(0,10);
  document.getElementById('f-time').value = f ? f.time : '12:00';
  document.getElementById('f-status').value = f ? f.status : 'Запланирован';

  document.getElementById('overlay').classList.add('open');
}

function closeForm() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

function saveFlight() {
  const airline = document.getElementById('f-airline').value;
  const number = document.getElementById('f-number').value.trim().toUpperCase();
  const destination = document.getElementById('f-destination').value.trim();
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const status = document.getElementById('f-status').value;

  if (!airline || !number || !destination || !date || !time) {
    alert('Выбери авиакомпанию и заполни остальные поля');
    return;
  }

  if (editingId) {
    const f = flights.find(x => x.id === editingId);
    Object.assign(f, { airline, number, destination, date, time, status });
  } else {
    flights.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      airline, number, destination, date, time, status
    });
  }

  save();
  closeForm();
  render();
}

function removeFlight(id) {
  const f = flights.find(x => x.id === id);
  if (!f) return;
  if (!confirm(`Удалить рейс ${f.number}?`)) return;
  flights = flights.filter(x => x.id !== id);
  save();
  render();
}

// Инициализация
load();
render();
</script>
</body>
</html>
